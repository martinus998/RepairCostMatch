name: Deploy RepairCostMatch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html style.css home-polish.css blueprint-home.css blueprint-detail.svg app.js favicon.svg robots.txt sitemap.xml privacy.html terms.html disclosure.html foundation-repair-cost.html basement-waterproofing-cost.html foundation-cracks.html bowing-basement-wall.html _site/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text()
          s = s.replace('</head>', '<link rel="stylesheet" href="home-polish.css?v=4"><link rel="stylesheet" href="blueprint-home.css?v=20260913-final2"></head>', 1)
          s = s.replace('src="app.js"', 'src="app.js?v=20260913-final2"', 1)
          p.write_text(s)

          js = Path('_site/app.js')
          t = js.read_text()
          t = t.replace('blueprint-home.css?v=20260913-detail1', 'blueprint-home.css?v=20260913-final2')
          js.write_text(t)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
