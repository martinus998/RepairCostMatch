name: Deploy RepairCostMatch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html style.css blueprint-home.css app.js favicon.svg robots.txt sitemap.xml privacy.html terms.html disclosure.html foundation-repair-cost.html foundation-repair-cost-per-pier.html helical-pier-cost.html push-pier-cost.html basement-waterproofing-cost.html basement-waterproofing-cost-per-square-foot.html foundation-cracks.html horizontal-foundation-crack.html bowing-basement-wall.html bowing-basement-wall-repair-cost.html repaircostmatch-guide.svg about.html methodology.html editorial-policy.html accessibility.html contact.html business.html 404.html site-pages.css social-card.svg readability-tune.css pro-package.css smart-tools.css smart-tools.js quote-checker.css quote-checker.js provider-market.css provider-market.js billing-live.js manifest.webmanifest sw.js google2066c20b50616af5.html _site/
          if [ -f pro-home.css ]; then cp pro-home.css _site/; fi
          if [ -f trust-center.css ]; then cp trust-center.css _site/; fi
          if [ -f trust-center.js ]; then cp trust-center.js _site/; fi
          if [ -d expenseleak ]; then cp -r expenseleak _site/; fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          build = os.environ.get('GITHUB_SHA','1')[:12]
          p = Path('_site/index.html')
          s = p.read_text()

          s = s.replace('<title>Foundation Repair Cost & Local Options | RepairCostMatch</title>','<title>RepairCostMatch | Foundation Repair Cost Estimator</title>')
          s = s.replace('<meta name="description" content="Understand foundation repair and basement waterproofing costs, common warning signs, and local repair options. Start with your problem and ZIP code.">','<meta name="description" content="Estimate foundation repair and basement waterproofing costs, check contractor quotes against broad planning ranges, and compare local options by ZIP.">')
          s = s.replace('<meta property="og:title" content="Foundation Repair Cost & Local Options | RepairCostMatch">','<meta property="og:title" content="RepairCostMatch | Foundation Repair Cost Estimator">')
          s = s.replace('<meta property="og:description" content="Describe the problem, understand likely causes, see a planning cost range and compare local repair options.">','<meta property="og:description" content="Estimate likely repair costs, check contractor quotes against broad planning ranges, and compare local foundation and waterproofing options.">')
          s = s.replace('{"@type":"Organization","name":"RepairCostMatch","url":"https://martinus998.github.io/RepairCostMatch/"}','{"@type":"Organization","@id":"https://martinus998.github.io/RepairCostMatch/#organization","name":"RepairCostMatch","alternateName":["Repair Cost Match","RepairCost Match"],"url":"https://martinus998.github.io/RepairCostMatch/","logo":"https://martinus998.github.io/RepairCostMatch/favicon.svg"}')
          s = s.replace('{"@type":"WebSite","name":"RepairCostMatch","url":"https://martinus998.github.io/RepairCostMatch/","inLanguage":"en-US"}','{"@type":"WebSite","@id":"https://martinus998.github.io/RepairCostMatch/#website","name":"RepairCostMatch","alternateName":["Repair Cost Match","RepairCost Match"],"url":"https://martinus998.github.io/RepairCostMatch/","publisher":{"@id":"https://martinus998.github.io/RepairCostMatch/#organization"},"inLanguage":"en-US"}')
          if 'name="application-name"' not in s:
              s = s.replace('</head>', '<meta name="application-name" content="RepairCostMatch"><meta property="og:locale" content="en_US"></head>', 1)

          social = '''<meta property="og:image" content="https://martinus998.github.io/RepairCostMatch/social-card.svg"><meta property="og:image:alt" content="RepairCostMatch — know the likely repair cost before you call"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="RepairCostMatch | Foundation Repair Cost Estimator"><meta name="twitter:description" content="Estimate likely repair costs, check contractor quotes against broad planning ranges, and compare local repair options."><meta name="twitter:image" content="https://martinus998.github.io/RepairCostMatch/social-card.svg"><link rel="stylesheet" href="site-pages.css?v=1">'''
          if 'property="og:image"' not in s:
              s = s.replace('</head>', social + '</head>', 1)
          if 'readability-tune.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="readability-tune.css?v=2"></head>', 1)
          if 'manifest.webmanifest' not in s:
              s = s.replace('</head>', '<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="smart-tools.css?v=1"><link rel="stylesheet" href="quote-checker.css?v=1"></head>', 1)
          if 'rcm-provider-api' not in s:
              provider = '<meta name="rcm-provider-api" content="https://vmtbydmhccmztnfedwpi.supabase.co/functions/v1/providers-search"><meta name="rcm-provider-key" content="sb_publishable_zMHcVYupndDRspbsYZRRfw_jSLwqmt_">'
              s = s.replace('</head>', provider + '</head>', 1)
          if 'class="skip-link"' not in s:
              s = s.replace('<body>', '<body><a class="skip-link" href="#top">Skip to content</a>', 1)
          s = s.replace('<nav>', '<nav aria-label="Primary navigation">', 1)
          guide_variants = [
              '<div class="guide-links"><a href="foundation-repair-cost.html"><span>Cost guide</span><b>Foundation repair</b></a><a href="basement-waterproofing-cost.html"><span>Cost guide</span><b>Waterproofing</b></a><a href="foundation-cracks.html"><span>Problem guide</span><b>Crack patterns</b></a><a href="bowing-basement-wall.html"><span>Problem guide</span><b>Bowing walls</b></a></div>',
              '<div class="guide-links"><a href="foundation-repair-cost.html"><span>Cost guide</span><b>Foundation repair</b></a><a href="foundation-repair-cost-per-pier.html"><span>Cost guide</span><b>Cost per pier</b></a><a href="basement-waterproofing-cost.html"><span>Cost guide</span><b>Waterproofing</b></a><a href="foundation-cracks.html"><span>Problem guide</span><b>Crack patterns</b></a><a href="horizontal-foundation-crack.html"><span>Problem guide</span><b>Horizontal cracks</b></a><a href="bowing-basement-wall.html"><span>Problem guide</span><b>Bowing walls</b></a></div>',
              '<div class="guide-links"><a href="foundation-repair-cost.html"><span>Cost guide</span><b>Foundation repair</b></a><a href="foundation-repair-cost-per-pier.html"><span>Cost guide</span><b>Cost per pier</b></a><a href="helical-pier-cost.html"><span>Cost guide</span><b>Helical piers</b></a><a href="basement-waterproofing-cost.html"><span>Cost guide</span><b>Waterproofing</b></a><a href="foundation-cracks.html"><span>Problem guide</span><b>Crack patterns</b></a><a href="horizontal-foundation-crack.html"><span>Problem guide</span><b>Horizontal cracks</b></a><a href="bowing-basement-wall.html"><span>Problem guide</span><b>Bowing walls</b></a><a href="bowing-basement-wall-repair-cost.html"><span>Cost guide</span><b>Bowing wall repair</b></a></div>'
          ]
          new_guides = '<div class="guide-links"><a href="foundation-repair-cost.html"><span>Cost guide</span><b>Foundation repair</b></a><a href="foundation-repair-cost-per-pier.html"><span>Cost guide</span><b>Cost per pier</b></a><a href="helical-pier-cost.html"><span>Cost guide</span><b>Helical piers</b></a><a href="push-pier-cost.html"><span>Cost guide</span><b>Push piers</b></a><a href="basement-waterproofing-cost.html"><span>Cost guide</span><b>Waterproofing</b></a><a href="basement-waterproofing-cost-per-square-foot.html"><span>Cost guide</span><b>Waterproofing per sq ft</b></a><a href="foundation-cracks.html"><span>Problem guide</span><b>Crack patterns</b></a><a href="horizontal-foundation-crack.html"><span>Problem guide</span><b>Horizontal cracks</b></a><a href="bowing-basement-wall.html"><span>Problem guide</span><b>Bowing walls</b></a><a href="bowing-basement-wall-repair-cost.html"><span>Cost guide</span><b>Bowing wall repair</b></a></div>'
          for old_guides in guide_variants:
              s = s.replace(old_guides, new_guides)
          if 'smart-tools.js' not in s:
              s = s.replace('</body>', '<script src="smart-tools.js?v=1" defer></script></body>', 1)
          if 'quote-checker.js' not in s:
              s = s.replace('</body>', '<script src="quote-checker.js?v=1" defer></script></body>', 1)
          s = s.replace('provider-market.js?v=2', 'provider-market.js?v=3')
          if 'provider-market.js' not in s:
              s = s.replace('</body>', '<script src="provider-market.js?v=3" defer></script></body>', 1)
          s = s.replace('billing-live.js?v=1', 'billing-live.js?v=2')
          if 'billing-live.js' not in s:
              s = s.replace('</body>', '<script src="billing-live.js?v=2" defer></script></body>', 1)
          old = '<a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="disclosure.html">Disclosure</a>'
          new = '<a href="about.html">About</a> · <a href="methodology.html">Methodology</a> · <a href="contact.html">Contact</a> · <a href="accessibility.html">Accessibility</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="disclosure.html">Disclosure</a>'
          s = s.replace(old, new)
          p.write_text(s)

          ep = Path('_site/expenseleak/index.html')
          if ep.exists():
              es = ep.read_text()
              es = es.replace('<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">','<meta name="viewport" content="width=901">')
              if 'secure-app.css' not in es:
                  es = es.replace('</head>', '<link rel="stylesheet" href="secure-app.css?v=1"></head>', 1)
              if 'secure-ops.css' not in es:
                  es = es.replace('</head>', '<link rel="stylesheet" href="secure-ops.css?v=1"></head>', 1)
              if 'secure-governance.css' not in es:
                  es = es.replace('</head>', '<link rel="stylesheet" href="secure-governance.css?v=1"></head>', 1)
              if 'secure-executive.css' not in es:
                  es = es.replace('</head>', '<link rel="stylesheet" href="secure-executive.css?v=1"></head>', 1)
              if 'secure-app.js' not in es:
                  es = es.replace('</body>', '<script src="secure-app.js?v=1" defer></script></body>', 1)
              if 'secure-ops.js' not in es:
                  es = es.replace('</body>', '<script src="secure-ops.js?v=1" defer></script></body>', 1)
              if 'secure-governance.js' not in es:
                  es = es.replace('</body>', '<script src="secure-governance.js?v=1" defer></script></body>', 1)
              if 'secure-procurement.js' not in es:
                  es = es.replace('</body>', '<script src="secure-procurement.js?v=2" defer></script></body>', 1)
              if 'secure-savings.js' not in es:
                  es = es.replace('</body>', '<script src="secure-savings.js?v=1" defer></script></body>', 1)
              if 'secure-compliance.js' not in es:
                  es = es.replace('</body>', '<script src="secure-compliance.js?v=1" defer></script></body>', 1)
              if 'secure-executive.js' not in es:
                  es = es.replace('</body>', '<script src="secure-executive.js?v=1" defer></script></body>', 1)
              if 'secure-optimization.js' not in es:
                  es = es.replace('</body>', '<script src="secure-optimization.js?v=1" defer></script></body>', 1)
              if 'secure-renewals.js' not in es:
                  es = es.replace('</body>', '<script src="secure-renewals.js?v=1" defer></script></body>', 1)
              if 'secure-enterprise-ops.js' not in es:
                  es = es.replace('</body>', '<script src="secure-enterprise-ops.js?v=1" defer></script></body>', 1)
              if 'secure-policy-center.js' not in es:
                  es = es.replace('</body>', '<script src="secure-policy-center.js?v=1" defer></script></body>', 1)
              if 'secure-platform.js' not in es:
                  es = es.replace('</body>', '<script src="secure-platform.js?v=1" defer></script></body>', 1)
              if 'secure-live-sync.js' not in es:
                  es = es.replace('</body>', '<script src="secure-live-sync.js?v=1" defer></script></body>', 1)
              if 'secure-search.js' not in es:
                  es = es.replace('</body>', '<script src="secure-search.js?v=1" defer></script></body>', 1)
              if 'secure-auth-resume.js' not in es:
                  es = es.replace('</body>', '<script src="secure-auth-resume.js?v=1" defer></script></body>', 1)
              secure_assets = (
                  'secure-app.css','secure-ops.css','secure-governance.css','secure-executive.css',
                  'secure-app.js','secure-ops.js','secure-governance.js','secure-procurement.js',
                  'secure-savings.js','secure-compliance.js','secure-executive.js','secure-optimization.js',
                  'secure-renewals.js','secure-enterprise-ops.js','secure-policy-center.js','secure-platform.js',
                  'secure-live-sync.js','secure-search.js','secure-auth-resume.js'
              )
              for asset in secure_assets:
                  es = es.replace(asset+'?v=1', asset+'?v='+build)
                  es = es.replace(asset+'?v=2', asset+'?v='+build)
              ep.write_text(es)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
