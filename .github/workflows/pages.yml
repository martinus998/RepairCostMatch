name: Deploy RepairCostMatch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build public artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html style.css blueprint-home.css app.js favicon.svg robots.txt sitemap.xml privacy.html terms.html disclosure.html foundation-repair-cost.html basement-waterproofing-cost.html foundation-cracks.html bowing-basement-wall.html about.html methodology.html editorial-policy.html accessibility.html contact.html 404.html site-pages.css social-card.svg readability-tune.css pro-package.css smart-tools.css smart-tools.js quote-checker.css quote-checker.js manifest.webmanifest sw.js _site/
          if [ -f pro-home.css ]; then cp pro-home.css _site/; fi
          if [ -f trust-center.css ]; then cp trust-center.css _site/; fi
          if [ -f trust-center.js ]; then cp trust-center.js _site/; fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text()
          social = '''<meta property="og:image" content="https://martinus998.github.io/RepairCostMatch/social-card.svg"><meta property="og:image:alt" content="RepairCostMatch — know the likely repair cost before you call"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="Foundation Repair Cost & Local Options | RepairCostMatch"><meta name="twitter:description" content="Understand likely repair costs, warning signs and next steps before you call a contractor."><meta name="twitter:image" content="https://martinus998.github.io/RepairCostMatch/social-card.svg"><link rel="stylesheet" href="site-pages.css?v=1">'''
          if 'property="og:image"' not in s:
              s = s.replace('</head>', social + '</head>', 1)
          if 'readability-tune.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="readability-tune.css?v=2"></head>', 1)
          if 'manifest.webmanifest' not in s:
              s = s.replace('</head>', '<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="smart-tools.css?v=1"><link rel="stylesheet" href="quote-checker.css?v=1"></head>', 1)
          if 'class="skip-link"' not in s:
              s = s.replace('<body>', '<body><a class="skip-link" href="#top">Skip to content</a>', 1)
          s = s.replace('<nav>', '<nav aria-label="Primary navigation">', 1)
          if 'smart-tools.js' not in s:
              s = s.replace('</body>', '<script src="smart-tools.js?v=1" defer></script></body>', 1)
          if 'quote-checker.js' not in s:
              s = s.replace('</body>', '<script src="quote-checker.js?v=1" defer></script></body>', 1)
          old = '<a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="disclosure.html">Disclosure</a>'
          new = '<a href="about.html">About</a> · <a href="methodology.html">Methodology</a> · <a href="contact.html">Contact</a> · <a href="accessibility.html">Accessibility</a> · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="disclosure.html">Disclosure</a>'
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
