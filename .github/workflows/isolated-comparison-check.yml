name: Isolated Comparison Check
on:
  push:
    branches: [main, feature/isolated-scope-diff-20260921]
    paths: [quote-scope-diff.html, sitemap-growth.xml, tests/isolated-comparison.test.cjs, .github/workflows/isolated-comparison-check.yml]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  compare-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify evidence preservation, limits and privacy boundary
        run: node tests/isolated-comparison.test.cjs
