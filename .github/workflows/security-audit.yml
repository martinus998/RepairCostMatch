name: Security Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Block sensitive file types
        shell: bash
        run: |
          set -euo pipefail
          bad=$(find . -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.jks' -o -name '*.keystore' -o -name 'credentials*.json' -o -name 'service-account*.json' -o -name 'secrets.json' -o -name '*.secret' -o -name '*.sqlite' -o -name '*.sqlite3' \) ! -name '.env.example' -print)
          if [ -n "$bad" ]; then
            echo "Sensitive file(s) must not be committed:"
            echo "$bad"
            exit 1
          fi
      - name: Scan for common credentials
        shell: bash
        run: |
          set -euo pipefail
          patterns='AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk_(live|test)_[A-Za-z0-9]{16,}|rk_(live|test)_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|sk-proj-[A-Za-z0-9_-]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|GOCSPX-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          if grep -RInE --exclude-dir=.git --exclude='security-audit.yml' "$patterns" .; then
            echo 'Potential credential detected.'
            exit 1
          fi
      - name: Block obvious secret assignments
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          names = (
              'STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|SUPABASE_SERVICE_ROLE_KEY|'
              'GOOGLE_CLIENT_SECRET|MICROSOFT_CLIENT_SECRET|SLACK_CLIENT_SECRET|'
              'XERO_CLIENT_SECRET|QUICKBOOKS_CLIENT_SECRET|OPENAI_API_KEY'
          )
          rx = re.compile(rf'(?i)\b(?:{names})\b\s*[:=]\s*["\']?([A-Za-z0-9_./+\-=]{{12,}})')
          bad=[]
          skip={'.git','node_modules'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(part in skip for part in p.parts) or p.name=='security-audit.yml':
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if rx.search(text):
                  bad.append(str(p))
          if bad:
              print('Potential hard-coded secret assignment detected:')
              print('\n'.join(bad))
              sys.exit(1)
          PY
