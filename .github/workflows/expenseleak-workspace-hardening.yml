name: ExpenseLeak Workspace Hardening

on:
  push:
    branches: ["main"]
    paths:
      - "expenseleak/.workspace-hardening-trigger"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply selected-workspace hardening
        run: python3 scripts/expenseleak_workspace_hardening.py
      - name: Commit hardened modules
        shell: bash
        run: |
          set -euo pipefail
          rm -f expenseleak/.workspace-hardening-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add expenseleak
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Harden remaining ExpenseLeak workspace modules"
          git push origin HEAD:main
