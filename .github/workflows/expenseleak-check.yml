name: ExpenseLeak Launch Check

on:
  push:
    branches: ["main"]
    paths:
      - "expenseleak/**"
      - ".github/workflows/expenseleak-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "expenseleak/**"
      - ".github/workflows/expenseleak-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate ExpenseLeak JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in expenseleak/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Validate launch pages and claims
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          errors=[]
          required=[
            'expenseleak/index.html','expenseleak/privacy.html','expenseleak/terms.html',
            'expenseleak/security.html','expenseleak/support.html','expenseleak/launch-center.js',
            'expenseleak/secure-platform.js','expenseleak/secure-connectors.js',
            'expenseleak/secure-data-quality.js','expenseleak/secure-data-ops.js',
            'expenseleak/secure-executive.js','expenseleak/secure-advanced-intelligence.js',
            'expenseleak/secure-savings.js','expenseleak/secure-renewals.js',
            'expenseleak/secure-procurement.js','expenseleak/secure-team.js',
            'expenseleak/secure-governance.js','expenseleak/secure-compliance.js',
            'expenseleak/secure-billing-readiness.js','expenseleak/secure-reliability.js',
            'expenseleak/secure-app.js','expenseleak/public-product-demo.js','expenseleak/public-competitor-demo.js'
          ]
          for p in required:
            if not Path(p).is_file(): errors.append(f'Missing required ExpenseLeak launch file: {p}')
          idx=Path('expenseleak/index.html').read_text(encoding='utf-8')
          for token in ['ExpenseLeak AI','Run Free Audit','Paid access stays disabled']:
            if token not in idx: errors.append(f'ExpenseLeak index missing safety/launch token: {token}')
          platform=Path('expenseleak/secure-platform.js').read_text(encoding='utf-8')
          for token in ['public-product-demo.js','public-competitor-demo.js','secure-connectors.js','launch-center.js','secure-data-quality.js','secure-advanced-intelligence.js','secure-billing-readiness.js','secure-reliability.js']:
            if token not in platform: errors.append(f'ExpenseLeak loader missing {token}')
          if '?v=1' in platform or '?v=2' in platform:
            errors.append('ExpenseLeak child loader must inherit the deploy version; fixed child cache tokens are not allowed')
          app=Path('expenseleak/secure-app.js').read_text(encoding='utf-8')
          for token in ['expenseleak_accessible_workspaces','expenseleak_user_preferences','ExpenseLeakSelectedBusinessId','elWorkspaceSwitch']:
            if token not in app: errors.append(f'Secure app missing multi-workspace safety token: {token}')
          launch=Path('expenseleak/launch-center.js').read_text(encoding='utf-8')
          for token in ['Paid launch remains gated separately','expenseleak_activation_readiness','expenseleak_data_quality_summary','First value ready','data-el-onboard','ExpenseLeakSelectedBusinessId']:
            if token not in launch: errors.append(f'Launch center missing required activation/gate token: {token}')
          quality=Path('expenseleak/secure-data-quality.js').read_text(encoding='utf-8')
          for token in ['Data Quality & Launch Readiness','zero connector errors','high-severity alerts','ExpenseLeakSelectedBusinessId','expenseleak_accessible_workspaces']:
            if token not in quality: errors.append(f'Data quality module missing readiness/workspace token: {token}')
          reliability=Path('expenseleak/secure-reliability.js').read_text(encoding='utf-8')
          for token in ['Reliability & Recovery Center','ExpenseLeakSelectedBusinessId','Run health check','No private document contents','unhandledrejection']:
            if token not in reliability: errors.append(f'Reliability center missing recovery token: {token}')
          workspace_scoped=[
            'secure-data-ops.js','secure-executive.js','secure-advanced-intelligence.js',
            'secure-savings.js','secure-renewals.js','secure-procurement.js','secure-team.js',
            'secure-governance.js','secure-compliance.js'
          ]
          for file in workspace_scoped:
            text=Path('expenseleak/'+file).read_text(encoding='utf-8')
            for token in ['ExpenseLeakSelectedBusinessId','expenseleak_accessible_workspaces','expenseleak:workspace-ready']:
              if token not in text: errors.append(f'{file} missing selected-workspace safety token: {token}')
          advanced=Path('expenseleak/secure-advanced-intelligence.js').read_text(encoding='utf-8')
          for token in ['Create review action','data-ap-review','data-ap-matched','does not automatically remove access']:
            if token not in advanced: errors.append(f'Advanced intelligence missing controlled-action token: {token}')
          savings=Path('expenseleak/secure-savings.js').read_text(encoding='utf-8')
          for token in ['Realized Savings Tracker','Only workspace-confirmed values','Currency totals are kept separate']:
            if token not in savings: errors.append(f'Savings workflow missing evidence/safety token: {token}')
          executive=Path('expenseleak/secure-executive.js').read_text(encoding='utf-8')
          for token in ['Save management report','Executive Management Snapshot']:
            if token not in executive: errors.append(f'Executive reporting missing E2E token: {token}')
          connectors=Path('expenseleak/secure-connectors.js').read_text(encoding='utf-8')
          for token in ['#vendor_portal=','history.replaceState','public-upload','private ExpenseLeak evidence vault','Do not upload passwords','ExpenseLeakSelectedBusinessId']:
            if token not in connectors: errors.append(f'Connector/Vendor Portal hardening missing token: {token}')
          if '?vendor_portal=' in connectors:
            errors.append('Vendor Portal token must not be placed in URL query parameters')
          billing=Path('expenseleak/secure-billing-readiness.js').read_text(encoding='utf-8')
          for token in ['Billing & Entitlement Readiness','expenseleak_workspace_entitlements','expenseleak_paid_launch_gate','Live checkout','server-side launch control','ExpenseLeakSelectedBusinessId']:
            if token not in billing: errors.append(f'Billing readiness missing paid-launch guardrail: {token}')
          for page in ['privacy.html','terms.html','security.html','support.html']:
            text=Path('expenseleak/'+page).read_text(encoding='utf-8')
            if '<title>' not in text.lower(): errors.append(f'{page} missing title')
            if 'name="description"' not in text: errors.append(f'{page} missing description')
          if errors:
            print('\n'.join('ERROR: '+e for e in errors));sys.exit(1)
          print('ExpenseLeak launch check passed.')
          PY
