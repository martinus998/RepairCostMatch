name: One-time RepairCostMatch GA fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-repaircostmatch-ga.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Replace incorrect GA4 measurement ID
        shell: bash
        run: |
          set -euo pipefail
          old='G-179DB077PE'
          new='G-4XJJ4PWB79'
          file='.github/workflows/pages.yml'
          if ! grep -q "$old" "$file"; then
            echo 'Old measurement ID not present; nothing to change.'
            exit 0
          fi
          sed -i "s/${old}/${new}/g" "$file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'Use RepairCostMatch GA4 measurement ID'
          git push
